[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openprospect"
version = "0.1.0"
description = "Free, local-first, open-source business prospecting and outreach workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
ai = ["httpx>=0.27,<1"]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
openprospect = "openprospect.cli:main"

[tool.setuptools.packages.find]
include = ["openprospect*"]
